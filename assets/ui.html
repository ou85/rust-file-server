<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <title>RSFS</title>
    <style>
        body {font-family: "Roboto", sans-serif;background: #f5f7fa;margin: 0;padding: 2rem;color: #202124;}
        h1 {font-size: 1.8rem;font-weight: 500;margin-bottom: 0.5rem;}
        h2 {font-size: 1.2rem;font-weight: 500;margin-top: 1.5rem;margin-bottom: 0.75rem;}
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }
        .logout-button {
            padding: 0.3rem 1.6rem;
            border: 1px solid #ff8983;
            border-radius: 0.25rem;
            font-weight: 500;
            cursor: pointer;
        }
        .logout-button:hover {background: #ff8983;border: 1px solid #d93025;}
        .logout-button:active {background: #ac5d59;border: 2px solid #ff5549;;}
        .upload-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .file-input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 1px solid #dadce0;
            border-radius: 0.45rem;
            font-size: 0.9rem;
            background: #fff;
            transition: border-color 0.2s ease;
        }
        .file-input:hover {border-color: #9aa0a6;}
        .file-input:focus {outline: none;border-color: #1a73e8;box-shadow: 0 0 0 2px rgba(26,115,232,0.2);}
        .upload-button {
            width: 7.5rem;
            height: 2.625rem;
            border: 1px solid #1a73e8;
            border-radius: 0.25rem;
            background: #1a73e8;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }
        .upload-button:hover {background: #1669c1; border: 1px solid #072545;}
        .upload-button:active {background: #0f4fa8;border: 2px solid #5f0571;}
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        th, td {padding: 0.75rem 1rem;text-align: left;border-bottom: 1px solid #e0e0e0;}
        th {background: #f8f9fa;font-weight: 500;color: #5f6368;}
        td button {
            margin: 0.5rem 0.2rem;
            padding: 0.6rem 0.8rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        td button:nth-child(1) { background: #e8f0fe; color: #1a73e8; border: 1px solid #e8f0fe}
        td button:nth-child(2) { background: #f1f3f4; color: #202124; border: 1px solid #f1f3f4}
        td button:nth-child(3) { background: #fce8e6; color: #d93025; border: 1px solid #fce8e6}
        td button:hover { opacity: 0.9; border: 1px solid blueviolet }
        td button:active { opacity: 1; border:1px solid rgb(95, 18, 18) }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>FILES</h1>
        <button type="submit" onclick="logout()" class="logout-button">⏻</button>
    </div>
    <h2>Upload</h2>
    <div class="upload-card">
        <input type="file" id="file" class="file-input" multiple>
        <button type="submit" onclick="upload()" class="upload-button">Upload</button>
    </div>
    <table id="files"></table>
    <script>
        async function load() {
        const res = await fetch('/files');
        const files = await res.json();
        const table = document.getElementById('files');
        table.innerHTML = '<tr><th>Name</th><th>Size</th><th>Date</th><th>Actions</th></tr>';
        files.forEach(f => {
            table.innerHTML += `
            <tr>
                <td>${f.filename}</td>
                <td style="width: 6rem; font-family: monospace, ui-monospace, system-ui, sans-serif; font-size: 0.75rem;text-align: right;">
                    ${formatSize(f.size)}
                </td>
                <td style="width: 8rem; font-family: monospace, ui-monospace, system-ui, sans-serif; font-size: 0.75rem;">
                    ${formatDate(f.created_at)}
                </td>
                <td style="width: 17rem;">
                    <button onclick="openFile('${f.id}')" style="padding:0.6rem 1rem;">Open</button>
                    <button onclick="downloadFile('${f.id}')">Download</button>
                    <button onclick="deleteFile('${f.id}')">Delete</button>
                </td>
            </tr>`;
            });
        }
        function openFile(id) { window.open('/files/' + id + '/open', '_blank'); }
        function downloadFile(id) { window.location = '/files/' + id + '/download'; }
        async function deleteFile(id) {
            if (!confirm("Delete file?")) {
                return;
            }
            await fetch('/files/' + id, { method: 'DELETE' });
            load();
        }
        async function upload() {
            const input = document.getElementById('file');
            const form = new FormData();
            for (const file of input.files) {
                form.append('files', file);
            }
            await fetch('/files/upload', {
                method: 'POST',
                body: form
            });
            input.value = '';
            load();
        }
        function formatDate(ts) {
            const d = new Date(ts * 1000);
            const yyyy = d.getFullYear().toString();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const min = String(d.getMinutes()).padStart(2, "0");

            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }
        async function logout() {
            await fetch('/logout', {
                method: 'POST'
            });
            window.location.href = '/login';
        }
        load();
    </script>
</body>
</html>
