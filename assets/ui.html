<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <title>RSFS</title>
    <style>
        body {font-family: "Roboto", sans-serif;background: #f5f7fa;margin: 0;padding: 2rem;color: #202124;}
        h1 {font-size: 1.8rem;font-weight: 500;margin-bottom: 0.5rem;}
        h2 {font-size: 1.2rem;font-weight: 500;margin-top: 1.5rem;margin-bottom: 0.75rem;}
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }
        .logout-button {
            height: 4rem;
            width: 4rem;
            border: 1px solid #00afa9;
            border-radius: 2rem;
            color:#00afa9;
            font-size: 1.5rem;
            cursor: pointer;
            margin-bottom: -1rem;
        }
        .logout-button:hover {background:#ff8983;border:1px solid #d93025; color:#d93025;}
        .logout-button:active {background:#d93025;border:1px solid #ff8983;color:#e0e0e0;scale:(0.98);}
        .upload-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .file-input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 1px solid #dadce0;
            border-radius: 0.45rem;
            font-size: 0.9rem;
            background: #fff;
            transition: border-color 0.2s ease;
        }
        .file-input:hover {border-color: #9aa0a6;}
        .file-input:focus {outline: none;border-color: #1a73e8;box-shadow: 0 0 0 2px rgba(26,115,232,0.2);}
        .upload-button {
            width: 7.5rem;
            height: 2.625rem;
            border: 1px solid #1a73e8;
            border-radius: 0.35rem;
            background: #1a73e8;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }
        .upload-button:hover {background: #1669c1; border: 1px solid #072545;}
        .upload-button:active {background: #0f4fa8;border: 2px solid #5f0571;}
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        th, td {padding: 0.75rem 1rem;text-align: left;border-bottom: 1px solid #e0e0e0;}
        th {background: #f8f9fa;font-weight: 500;color: #5f6368;}
        td button {
            margin: 0.5rem 0.2rem;
            padding: 0.6rem 0.8rem;
            border-radius: 0.45rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            height: 2.5rem;
            min-width: 2.875rem;
        }
        td button:nth-child(1) { background: #e8f0fe; color: #1a73e8; border: 1px solid #e8f0fe}
        td button:nth-child(2) { background: #f1f3f4; color: #202124; border: 1px solid #f1f3f4}
        td button:nth-child(3) { background: #fce8e6; color: #d93025; border: 1px solid #fce8e6}
        td button:hover { 
            filter: brightness(0.85);
            border: 1px solid blueviolet
        }
        td button:active { 
            filter: brightness(0.6);
            transform: scale(0.98);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 1.5rem 2rem;
            max-width: 24rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-box p {
            margin: 0 0 1.5rem 0;
            font-size: 1rem;
            color: #202124;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
        .modal-actions button {
            padding: 0.5rem 1.25rem;
            border-radius: 0.35rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .modal-btn-yes {
            background: #d93025;
            color: white;
            border: 1px solid #d93025;
        }
        .modal-btn-yes:hover { background: #b3261e; }
        .modal-btn-no {
            background: #f1f3f4;
            color: #202124;
            border: 1px solid #f1f3f4;
        }
        .modal-btn-no:hover { background: #e0e0e0; }
        .progress-container {
            display: none;
            width: 100%;
            height: 0.5rem;
            background: #e0e0e0;
            border-radius: 0.25rem;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-container.active { display: block; }
        .progress-bar {
            height: 100%;
            background: #1a73e8;
            width: 0%;
            transition: width 0.2s ease;
        }
        .progress-text {
            display: none;
            font-size: 0.8rem;
            color: #5f6368;
            margin-top: 0.3rem;
        }
        .progress-text.active { display: block; }
    </style>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 28px 20px 48px; background: #f7f7f5; color: #161616; }
        .page-shell { width: min(900px, 100%); margin: 0 auto; }
        .top-bar { align-items: center; margin: 0 0 24px; }
        .brand h1 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -.03em; }
        .brand p { margin: 7px 0 0; color: #666; font-size: 16px; }
        .logout-button { width: 48px; height: 48px; margin: 0; border: 1px solid #d0d0d0; border-radius: 10px; background: #fff; color: #e34b4b; font-size: 22px; }
        .logout-button:hover { background: #f0f0f0; border-color: #b9b9b5; color: #c93636; }
        .status-card, .files-card { background: #fff; border: 1px solid #d8d8d5; border-radius: 15px; padding: 24px; box-shadow: none; }
        .status-card { margin-bottom: 18px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; min-height: 34px; font-size: 16px; }
        .status-online { color: #159447; font-size: 14px; }
        .status-divider { border: 0; border-top: 1px solid #e5e5e2; margin: 13px 0; }
        .storage-value { font-weight: 600; }
        .storage-placeholder { margin-top: 10px; height: 8px; overflow: hidden; border-radius: 4px; background: #e6e6e6; }
        .storage-placeholder span { display: block; width: 0; height: 100%; background: #36c76b; }
        .storage-meta { display: flex; justify-content: space-between; margin-top: 6px; color: #666; font-size: 13px; }
        .files-card { padding-bottom: 10px; }
        .files-card h2 { margin: 0 0 18px; font-size: 20px; font-weight: 700; }
        .upload-card { display: block; margin: 0 0 18px; padding: 0; background: transparent; box-shadow: none; }
        .drop-zone { min-height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border: 1px dashed #aaa; border-radius: 14px; background: #fafafa; color: #161616; cursor: pointer; transition: .15s ease; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: #36a962; background: #f4fbf6; }
        .drop-title { font-weight: 700; }
        .drop-hint { color: #777; font-size: 13px; }
        .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .upload-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
        .upload-button { width: auto; height: 38px; padding: 0 17px; border: 1px solid #2da35a; border-radius: 8px; background: #36c76b; color: #fff; }
        .upload-button:hover { background: #2eaf5d; border-color: #258d4b; }
        .ready-queue { display: none; margin-top: 14px; padding: 14px; border: 1px solid #d8d8d5; border-radius: 11px; background: #fff; }
        .ready-queue.visible { display: block; }
        .queue-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
        .queue-clear, .queue-remove { border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; color: #222; cursor: pointer; }
        .queue-clear { min-width: 48px; height: 32px; }
        .queue-clear:hover, .queue-remove:hover { border-color: #d85b5b; color: #c73d3d; background: #fff7f7; }
        .queue-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
        .queue-item { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; background: #f5f5f3; }
        .queue-file-info { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
        .queue-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
        .queue-file-size { flex: none; color: #777; font-size: 12px; }
        .queue-remove { flex: none; height: 32px; padding: 0 10px; }
        .queue-upload { width: 100%; height: 38px; margin-top: 12px; border: 1px solid #348b50; border-radius: 8px; background: #43a563; color: #fff; font-weight: 600; cursor: pointer; }
        .queue-upload:hover { background: #378f54; }
        .file-toolbar { display: flex; gap: 12px; margin-top: 48px; }
        .file-search, .file-sort, .file-page-size { height: 38px; border: 1px solid #c8c8c8; border-radius: 8px; background: #fff; color: #222; font: inherit; font-size: 14px; }
        .file-search { min-width: 0; flex: 1; padding: 0 12px; }
        .file-search::placeholder { color: #777; }
        .file-search:focus-visible, .file-sort:focus-visible, .file-page-size:focus-visible { outline: 2px solid #75c995; outline-offset: 1px; }
        .file-sort { width: 180px; padding: 0 10px; }
        .file-page-size { width: 112px; padding: 0 8px; }
        .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: .375rem; margin: 1rem 0 1.25rem; }
        .pagination button { min-width: 2.25rem; height: 2.25rem; padding: 0 .625rem; border: 1px solid #d0d0d0; border-radius: .5rem; background: #fff; color: #222; font: inherit; cursor: pointer; }
        .pagination button:hover:not(:disabled):not(.current) { background: #f0f0f0; border-color: #b9b9b5; }
        .pagination button.current { border-color: #348b50; background: #edf9f1; color: #176b34; font-weight: 600; }
        .pagination button:disabled { color: #999; cursor: default; }
        .pagination-ellipsis { padding: 0 .2rem; color: #777; }
        .pagination button.page-prev, .pagination button.page-next { position: relative; min-width: 2.25rem; padding: 0; color: transparent; font-size: 0; }
        .pagination button.page-prev::before, .pagination button.page-next::before { content: ""; position: absolute; top: 50%; left: 50%; width: .55rem; height: .55rem; border-color: #555; border-style: solid; border-width: .12rem 0 0 .12rem; }
        .pagination button.page-prev::before { transform: translate(-35%, -50%) rotate(-45deg); }
        .pagination button.page-next::before { transform: translate(-65%, -50%) rotate(135deg); }
        .pagination button.page-prev:hover:not(:disabled)::before, .pagination button.page-next:hover:not(:disabled)::before { border-color: #222; }
        .pagination button.page-prev:disabled::before, .pagination button.page-next:disabled::before { border-color: #aaa; }
        .selection-toolbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 36px; visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .12s ease; }
        .selection-toolbar.visible { visibility: visible; opacity: 1; pointer-events: auto; }
        .selection-count, .selection-action { height: 34px; border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; color: #222; font: inherit; font-size: 13px; }
        .selection-count { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-width: 5.25rem; height: 2.125rem; margin-right: 1rem; padding: 0 .6875rem; border: 1px solid #d0d0d0; border-radius: 1.0625rem; 
            color: #222; font: inherit; font-size: .8125rem; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease, transform .08s ease; }
        .selection-count:hover { background: #fff; border-color: #b9b9b5; box-shadow: 0 0 0 .125rem #eeeeec; }
        .selection-dismiss { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; font-size: 1rem; line-height: 1; }
        .selection-action { min-width: 34px; padding: 0 10px; cursor: pointer; transition: border-color .12s ease, box-shadow .12s ease, transform .08s ease; }
        .selection-action:hover { background: #fff; border-color: #b9b9b5; box-shadow: 0 0 0 .125rem #eeeeec; }
        .selection-count:active, .selection-action:active { transform: translateY(1px); }
        .selection-count:focus-visible, .selection-action:focus-visible { outline: 2px solid #75c995; outline-offset: 2px; }
        .selection-delete { color: #222; border-color: #d0d0d0; }
        .selection-delete:hover { color: #222; border-color: rgba(217,48,37,.58); background: #fff; box-shadow: 0 0 0 .125rem rgba(217,48,37,.28); }
        .selection-download { color: #222; border-color: #d0d0d0; }
        .selection-download:hover { color: #222; border-color: #65db91; background: #fff; box-shadow: 0 0 0 .125rem rgba(101,219,145,.55); }
        .selection-animated-icon { display: block; width: 1.25rem; height: 1.25rem; object-fit: contain; }
        .file-checkbox { width: 20px; height: 20px; margin: 0; accent-color: #65db91; cursor: pointer; vertical-align: middle; }
        tr.selected-row td { background: #efefed; }
        th:first-child, td:first-child { width: 36px; padding-right: 2px; }
        td.file-name { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        .files-table { width: 100%; margin-top: 1.375rem; table-layout: fixed; border: 0; border-radius: 0; box-shadow: none; }
        .files-table th, .files-table td { padding: .875rem .625rem; border-bottom: 1px solid #e5e5e2; }
        .files-table th:first-child, .files-table td:first-child { width: 2.25rem; }
        .files-table th:nth-child(2), .files-table td:nth-child(2) { width: auto; }
        .files-table th:nth-child(3), .files-table td:nth-child(3) { width: 8.125rem; }
        .files-table th:nth-child(4), .files-table td:nth-child(4) { width: 6rem; white-space: nowrap; }
        .files-table th:last-child, .files-table td:last-child { width: 5.5rem; padding-left: 0; padding-right: 0; text-align: center; }
        .files-table th { background: transparent; color: #858585; font-size: .8125rem; font-weight: 400; }
        .files-table td { font-size: .9375rem; }
        .files-table td.file-name { font-weight: 600; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
        .files-table td.file-date, .files-table td.file-size { color: #666; font-size: .875rem; white-space: nowrap; }
        .files-table th:nth-child(4), .files-table td.file-size { text-align: right; }
        .files-table td button { width: 3.75rem; height: 2.125rem; min-width: 0; margin: 0; padding: .375rem .5rem; border: 1px solid #d0d0d0; border-radius: .5rem; background: #fff; color: #222; }
        .files-table td button:hover { filter: none; border-color: #b9b9b5; background: #f0f0f0; }
        body.modal-open { overflow: hidden; }
        .modal-overlay { z-index: 1200; }
        .image-modal { display: none; position: fixed; inset: 0; z-index: 1100; align-items: center; justify-content: center; background: rgba(20, 20, 18, .9); }
        .image-modal.active { display: flex; }
        .image-modal-content { position: relative; width: min(92vw, 76rem); height: min(88vh, 52rem); display: flex; align-items: center; justify-content: center; }
        .image-modal img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
        .image-modal-toolbar { position: absolute; top: 0; left: 0; display: flex; gap: .5rem; }
        .image-modal-button { display: inline-flex; align-items: center; justify-content: center; min-width: 2.5rem; height: 2.25rem; padding: 0 .75rem; border: 1px solid rgba(255,255,255,.38); border-radius: .5rem; background: rgba(0,0,0,.55); color: #fff; font: inherit; font-size: 1.2rem; font-weight: 700; line-height: 1; cursor: pointer; }
        .image-modal-button:hover { background: rgba(0,0,0,.78); border-color: rgba(255,255,255,.7); }
        .image-modal-button img { width: 1.25rem; height: 1.25rem; object-fit: contain; pointer-events: none; }
        .image-modal-delete:hover { color: #ff8585; border-color: #ff8585; background: rgba(80,0,0,.82); }
        .image-modal-close { position: absolute; top: 0; right: 0; width: 2.5rem; min-width: 0; padding: 0; font-size: 1.5rem; line-height: 1; }
        .image-modal-nav { position: fixed; top: 50%; width: 4rem; height: 7rem; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; }
        .image-modal-prev { left: 0; }
        .image-modal-next { right: 0; }
        .image-modal-nav::before { content: ""; position: absolute; top: 50%; width: 1.5rem; height: 1.5rem; border-color: #fff; border-style: solid; border-width: .18rem 0 0 .18rem; }
        .image-modal-prev::before { left: 1.5rem; transform: translateY(-50%) rotate(-45deg); }
        .image-modal-next::before { right: 1.5rem; transform: translateY(-50%) rotate(135deg); }
        .image-modal-nav:hover::before { border-color: #65db91; }
        .image-modal-caption { position: absolute; bottom: 0; left: 50%; max-width: 70%; transform: translateX(-50%); overflow: hidden; color: #fff; font-size: .875rem; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 620px) { body { padding: 1.25rem 1rem 2.25rem; } .status-card, .files-card { padding: 1.125rem; } .file-toolbar { gap: .5rem; margin-top: 2rem; } .file-sort { width: 9.375rem; } .file-page-size { width: 6.25rem; } .files-table th, .files-table td { padding-left: .375rem; padding-right: .375rem; } .files-table th:first-child, .files-table td:first-child { width: 2rem; } .files-table th:nth-child(4), .files-table td:nth-child(4) { display: table-cell !important; width: 5rem; } .files-table th:last-child, .files-table td:last-child { width: 4.75rem; padding-left: 0; padding-right: 0; text-align: center; } }
        @media (max-width: 480px) { .files-table th:nth-child(3), .files-table td:nth-child(3) { display: none; } }
    </style>
</head>
<body>
    <main class="page-shell">
    <header class="top-bar">
        <div class="brand"><h1>RSFS</h1><p id="appSubtitle">Local Encrypted Storage</p></div>
        <button type="submit" onclick="logout()" class="logout-button">⏻</button>
    </header>
    <section class="status-card" aria-label="Server status">
        <div class="status-row"><span>Server</span><span class="status-online">online</span></div>
        <hr class="status-divider">
        <div class="status-row"><span>Storage</span><span class="storage-value"><span id="storageUsed">—</span> of <span id="storageTotal">—</span></span></div>
        <div class="storage-placeholder" aria-hidden="true"><span id="storageProgress"></span></div>
        <div class="storage-meta"><span id="storagePercent">—</span><span id="storageAvailable">— available</span></div>
        <hr class="status-divider">
    </section>
    <section class="files-card">
        <h2>Files</h2>
        <div class="upload-card">
            <label class="drop-zone" for="file" id="dropZone">
                <span class="drop-title">Drop files here</span>
                <span class="drop-hint">or choose files to add them to the upload list</span>
                <input type="file" id="file" class="file-input" multiple>
            </label>
        </div>
        <section class="ready-queue" id="readyQueue" aria-live="polite">
            <div class="queue-header"><span>Ready to upload</span><button type="button" class="queue-clear" onclick="clearQueue()">Clear</button></div>
            <div class="queue-list" id="queueList"></div>
            <button type="button" class="queue-upload" onclick="upload()">Upload selected files</button>
        </section>
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
    <div class="file-toolbar">
        <input class="file-search" id="fileSearch" type="search" placeholder="Search files" aria-label="Search files">
        <select class="file-sort" id="fileSort" aria-label="Sort files">
            <option value="recent">Recently updated</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
            <option value="size-desc">Largest first</option>
            <option value="size-asc">Smallest first</option>
            <option value="oldest">Oldest uploaded</option>
        </select>
        <select class="file-page-size" id="filePageSize" aria-label="Files per page">
            <option value="10">10 files</option>
            <option value="20" selected>20 files</option>
            <option value="50">50 files</option>
        </select>
    </div>
    <div class="selection-toolbar" id="selectionToolbar">
        <button type="button" class="selection-count" onclick="clearSelection()" aria-label="Clear selected files"><span id="selectionCount"></span><span class="selection-dismiss" aria-hidden="true"><img class="selection-animated-icon" src="/assets/icons/cancel-static.png" data-static-src="/assets/icons/cancel-static.png" data-animated-src="/assets/icons/cancel-48.gif" alt=""></span></button>
        <button type="button" class="selection-action selection-download" onclick="downloadSelected()" aria-label="Download selected files"><img class="selection-animated-icon" src="/assets/icons/download-48-static.png" data-static-src="/assets/icons/download-48-static.png" data-animated-src="/assets/icons/download-48.gif" alt=""></button>
        <button type="button" class="selection-action selection-delete" onclick="deleteSelected()" aria-label="Delete selected files"><img class="selection-animated-icon" src="/assets/icons/trash-static.png" data-static-src="/assets/icons/trash-static.png" data-animated-src="/assets/icons/trash-48.gif" alt=""></button>
    </div>
    <table id="files" class="files-table"></table>
    <nav class="pagination" id="pagination" aria-label="File pages"></nav>
    </section>
    </main>

    <div class="image-modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Image preview">
        <button type="button" class="image-modal-nav image-modal-prev" onclick="navigateImage(-1)" aria-label="Previous image"></button>
        <div class="image-modal-content">
            <div class="image-modal-toolbar">
                <button type="button" class="image-modal-button" id="downloadCurrentImageButton" onclick="downloadCurrentImage()" aria-label="Download" title="Download"><img src="/assets/icons/download.png" alt=""></button>
                <button type="button" class="image-modal-button image-modal-delete" onclick="deleteCurrentImage()" aria-label="Delete" title="Delete"><img src="/assets/icons/delete.png" alt=""></button>
            </div>
            <button type="button" class="image-modal-button image-modal-close" onclick="closeImageModal()" aria-label="Close image preview"><img src="/assets/icons/cancel.png" alt=""></button>
            <img id="imageModalImage" alt="">
            <div class="image-modal-caption" id="imageModalCaption"></div>
        </div>
        <button type="button" class="image-modal-nav image-modal-next" onclick="navigateImage(1)" aria-label="Next image"></button>
    </div>

    <script>
        let allFiles = [];
        const selectedIds = new Set();
        let downloadingSelection = false;
        let currentPage = 1;
        let pageSize = 20;
        let totalPages = 1;
        let fileRequestId = 0;

        async function load(refreshStorage = false) {
            const requestId = ++fileRequestId;
            const search = document.getElementById('fileSearch').value.trim();
            const sort = document.getElementById('fileSort').value;
            const params = new URLSearchParams({ page: currentPage, per_page: pageSize, search, sort });
            const filesPromise = fetch(`/files?${params}`);
            const [filesRes] = refreshStorage
                ? await Promise.all([filesPromise, loadStorage()])
                : [await filesPromise];
            if (requestId !== fileRequestId) return;
            if (!filesRes.ok) throw new Error('Could not load files');
            const result = await filesRes.json();
            allFiles = result.files;
            currentPage = result.page;
            pageSize = result.per_page;
            totalPages = Math.max(1, Math.ceil(result.total / pageSize));
            renderFiles();
            renderPagination();
        }

        async function loadStorage() {
            try {
                const response = await fetch('/storage');
                if (!response.ok) return;
                const storage = await response.json();
                const percent = storage.total_bytes ? (storage.used_bytes / storage.total_bytes) * 100 : 0;
                document.getElementById('storageUsed').textContent = formatStorageSize(storage.used_bytes);
                document.getElementById('storageTotal').textContent = formatStorageSize(storage.total_bytes);
                document.getElementById('storageAvailable').textContent = `${formatStorageSize(storage.available_bytes)} available`;
                document.getElementById('storagePercent').textContent = `${percent.toFixed(1)}%`;
                document.getElementById('storageProgress').style.width = `${Math.min(100, percent)}%`;
            } catch (_) { /* Keep the placeholder if storage stats are unavailable. */ }
        }

        function renderFiles() {
            const files = allFiles;
            const table = document.getElementById('files');
            table.replaceChildren();
            const headerRow = document.createElement('tr');
            const selectAllHeader = document.createElement('th');
            const selectAll = document.createElement('input');
            selectAll.type = 'checkbox'; selectAll.className = 'file-checkbox'; selectAll.setAttribute('aria-label', 'Select visible files');
            selectAll.checked = files.length > 0 && files.every(file => selectedIds.has(file.id));
            selectAll.indeterminate = files.some(file => selectedIds.has(file.id)) && !selectAll.checked;
            selectAll.addEventListener('change', () => {
                files.forEach(file => selectAll.checked ? selectedIds.add(file.id) : selectedIds.delete(file.id));
                renderFiles();
            });
            selectAllHeader.appendChild(selectAll); headerRow.appendChild(selectAllHeader);
            ['Name', 'Date', 'Size', ''].forEach(text => {
                const th = document.createElement('th'); th.textContent = text; headerRow.appendChild(th);
            });
            table.appendChild(headerRow);
            files.forEach(f => {
                const row = document.createElement('tr');
                row.classList.toggle('selected-row', selectedIds.has(f.id));
                const selectCell = document.createElement('td');
                const select = document.createElement('input'); select.type = 'checkbox'; select.className = 'file-checkbox'; select.checked = selectedIds.has(f.id); select.setAttribute('aria-label', `Select ${f.filename}`);
                select.addEventListener('change', () => { select.checked ? selectedIds.add(f.id) : selectedIds.delete(f.id); renderFiles(); });
                selectCell.appendChild(select); row.appendChild(selectCell);
                const name = document.createElement('td'); name.className = 'file-name'; name.textContent = f.filename; row.appendChild(name);
                const date = document.createElement('td'); date.className = 'file-date'; date.textContent = formatDate(f.created_at); row.appendChild(date);
                const size = document.createElement('td'); size.className = 'file-size'; size.textContent = formatSize(f.size); row.appendChild(size);
                const actions = document.createElement('td'); actions.className = 'file-actions';
                const actionsList = [];
                if (canOpen(f.filename)) actionsList.push(['Open', () => openFile(f.id)]);
                actionsList.forEach(([text, action]) => {
                    const button = document.createElement('button'); button.textContent = text; button.addEventListener('click', action); actions.appendChild(button);
                });
                row.appendChild(actions); table.appendChild(row);
            });
            renderSelectionToolbar();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.replaceChildren();
            const addButton = (label, page, { disabled = false, current = false, aria = label, className = '' } = {}) => {
                const button = document.createElement('button');
                button.type = 'button'; button.textContent = label; button.disabled = disabled;
                button.className = className;
                button.setAttribute('aria-label', aria);
                if (current) { button.className = 'current'; button.setAttribute('aria-current', 'page'); }
                button.addEventListener('click', () => { if (!disabled && page !== currentPage) { currentPage = page; load(); } });
                pagination.appendChild(button);
            };
            addButton('‹', Math.max(1, currentPage - 1), { disabled: currentPage === 1, aria: 'Previous page', className: 'page-prev' });
            let pages;
            if (totalPages <= 5) {
                pages = Array.from({ length: totalPages }, (_, index) => index + 1);
            } else {
                const visible = new Set([1, 2, totalPages, currentPage - 1, currentPage, currentPage + 1]);
                pages = [...visible].filter(page => page >= 1 && page <= totalPages).sort((a, b) => a - b);
            }
            let previous = 0;
            for (const page of pages) {
                if (page - previous > 1) {
                    const ellipsis = document.createElement('span'); ellipsis.className = 'pagination-ellipsis'; ellipsis.textContent = '…';
                    pagination.appendChild(ellipsis);
                }
                addButton(String(page), page, { current: page === currentPage, aria: `Page ${page}` });
                previous = page;
            }
            addButton('›', Math.min(totalPages, currentPage + 1), { disabled: currentPage === totalPages, aria: 'Next page', className: 'page-next' });
        }

        function renderSelectionToolbar() {
            const toolbar = document.getElementById('selectionToolbar');
            const count = selectedIds.size;
            toolbar.classList.toggle('visible', count > 0);
            document.getElementById('selectionCount').textContent = `${count} ${count === 1 ? 'file' : 'files'}`;
        }

        function clearSelection() {
            selectedIds.clear();
            renderFiles();
        }

        async function downloadSelected() {
            if (downloadingSelection || selectedIds.size === 0) return;
            downloadingSelection = true;
            const button = document.querySelector('.selection-download');
            button.disabled = true;
            const ids = [...selectedIds];
            let failed = 0;
            try {
                for (const [index, id] of ids.entries()) {
                    if (index > 0) await new Promise(resolve => window.setTimeout(resolve, 150));
                    const url = `/files/${encodeURIComponent(id)}/download`;
                    if (!await checkFileExists(id, url)) {
                        failed++;
                        continue;
                    }
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = ''; link.hidden = true;
                    document.body.appendChild(link);
                    try {
                        link.click();
                    } finally {
                        link.remove();
                    }
                    // Native downloads do not expose completion; clear only files handed to the browser.
                    selectedIds.delete(id);
                    renderFiles();
                }
                if (failed > 0) alert(`Could not start downloading ${failed} ${failed === 1 ? 'file' : 'files'}. They remain selected.`);
            } finally {
                downloadingSelection = false;
                button.disabled = false;
            }
        }

        document.getElementById('fileSearch').addEventListener('input', () => { currentPage = 1; load(); });
        document.getElementById('fileSort').addEventListener('change', () => { currentPage = 1; load(); });
        document.getElementById('filePageSize').addEventListener('change', event => {
            pageSize = Number(event.target.value); currentPage = 1; load();
        });
        document.querySelectorAll('#selectionToolbar .selection-count, #selectionToolbar .selection-download, #selectionToolbar .selection-delete').forEach(button => {
            const icon = button.querySelector('.selection-animated-icon');
            const showAnimation = () => { icon.src = icon.dataset.animatedSrc; };
            const showStatic = () => { icon.src = icon.dataset.staticSrc; };
            button.addEventListener('mouseenter', showAnimation);
            button.addEventListener('mouseleave', showStatic);
            button.addEventListener('focus', showAnimation);
            button.addEventListener('blur', showStatic);
        });

        function canOpen(filename) {
            const name = filename.toLowerCase();
            return /\.(pdf|svg|md|markdown|txt|text|log|csv|json|xml|yaml|yml|toml|ini|conf|png|jpe?g|gif|webp|avif|mp4|webm|mov|m4v|mkv|mp3|wav|ogg|flac)$/.test(name);
        }

        let pendingFiles = [];
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('file');
        fileInput.addEventListener('change', () => addFiles(fileInput.files));
        ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, event => {
            event.preventDefault(); dropZone.classList.add('drag-over');
        }));
        ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, event => {
            event.preventDefault(); dropZone.classList.remove('drag-over');
        }));
        dropZone.addEventListener('drop', event => {
            if (event.dataTransfer.files.length) addFiles(event.dataTransfer.files);
        });

        function addFiles(files) {
            for (const file of files) {
                const duplicate = pendingFiles.some(item => item.name === file.name && item.size === file.size && item.lastModified === file.lastModified);
                if (!duplicate) pendingFiles.push(file);
            }
            renderQueue();
        }

        function renderQueue() {
            const queue = document.getElementById('readyQueue');
            const list = document.getElementById('queueList');
            list.replaceChildren();
            queue.classList.toggle('visible', pendingFiles.length > 0);
            pendingFiles.forEach((file, index) => {
                const row = document.createElement('div'); row.className = 'queue-item';
                const info = document.createElement('div'); info.className = 'queue-file-info';
                const name = document.createElement('span'); name.className = 'queue-file-name'; name.textContent = file.name;
                const size = document.createElement('span'); size.className = 'queue-file-size'; size.textContent = formatSize(file.size);
                info.append(name, size);
                const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'queue-remove'; remove.textContent = 'Remove'; remove.onclick = () => removeQueuedFile(index);
                row.append(info, remove); list.appendChild(row);
            });
        }

        function removeQueuedFile(index) { pendingFiles.splice(index, 1); renderQueue(); }
        function clearQueue() { pendingFiles = []; fileInput.value = ''; renderQueue(); }
        // function openFile(id) { window.open('/files/' + id + '/open', '_blank'); }
        // function downloadFile(id) { window.location = '/files/' + id + '/download'; }

        // Logout on tab close or reload
        // window.addEventListener('beforeunload', () => {
        //     navigator.sendBeacon('/logout', new Blob([], {type: 'application/json'}));
        // });


        let imagePreviewFiles = [];
        let imagePreviewIndex = 0;

        function isRasterImage(filename) {
            return /\.(png|jpe?g|gif|webp|avif|bmp)$/.test(filename.toLowerCase());
        }

        function isVideoFile(filename) {
            return /\.(mp4|webm|mov|m4v|mkv|avi|ogv|mpeg|mpg|3gp)$/.test(filename.toLowerCase());
        }

        function showImageModal(id) {
            imagePreviewFiles = allFiles.filter(file => isRasterImage(file.filename));
            imagePreviewIndex = imagePreviewFiles.findIndex(file => file.id === id);
            if (imagePreviewIndex < 0) return;
            updateImageModal();
            document.getElementById('imageModal').classList.add('active');
            document.body.classList.add('modal-open');
        }

        function updateImageModal() {
            const file = imagePreviewFiles[imagePreviewIndex];
            if (!file) return;
            const image = document.getElementById('imageModalImage');
            image.src = `/files/${encodeURIComponent(file.id)}/open`;
            image.alt = file.filename;
            document.getElementById('imageModalCaption').textContent = `${file.filename} · ${formatSize(file.size)}`;
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.classList.remove('modal-open');
            document.getElementById('imageModalImage').removeAttribute('src');
        }

        function navigateImage(direction) {
            if (!imagePreviewFiles.length) return;
            imagePreviewIndex = (imagePreviewIndex + direction + imagePreviewFiles.length) % imagePreviewFiles.length;
            updateImageModal();
        }

        function downloadCurrentImage() {
            const file = imagePreviewFiles[imagePreviewIndex];
            if (file) downloadFile(file.id);
        }

        function deleteCurrentImage() {
            const file = imagePreviewFiles[imagePreviewIndex];
            if (!file) return;
            const deletedIndex = imagePreviewIndex;
            showConfirmModal(`Permanently delete ${file.filename}?`, async () => {
                await performDelete(file.id);
                imagePreviewFiles.splice(deletedIndex, 1);
                if (deletedIndex === 0 || imagePreviewFiles.length === 0) {
                    closeImageModal();
                    return;
                }
                imagePreviewIndex = deletedIndex - 1;
                updateImageModal();
            });
        }

        document.addEventListener('keydown', event => {
            if (!document.getElementById('imageModal').classList.contains('active')) return;
            if (event.key === 'Escape' || event.key === ' ') { event.preventDefault(); closeImageModal(); }
            if (event.key === 'ArrowLeft') { event.preventDefault(); navigateImage(-1); }
            if (event.key === 'ArrowRight') { event.preventDefault(); navigateImage(1); }
        });
        document.getElementById('imageModal').addEventListener('wheel', event => {
            if (!document.getElementById('imageModal').classList.contains('active')) return;
            event.preventDefault();
            navigateImage(event.deltaY > 0 ? 1 : -1);
        }, { passive: false });

        async function openFile(id) {
            const file = allFiles.find(item => item.id === id);
            if (file && isRasterImage(file.filename)) {
                showImageModal(id);
                return;
            }
            const openUrl = isVideoFile(file?.filename)
                ? '/files/' + encodeURIComponent(id) + '/player'
                : '/files/' + encodeURIComponent(id) + '/open';
            const exists = await checkFileExists(id, openUrl);
            if (!exists) {
                showConfirmModal('File not found. Delete the entry?', () => deleteFile(id, true));
                return;
            }
            window.open(openUrl, '_blank');
        }

        async function downloadFile(id) {
            const url = '/files/' + id + '/download';
            const exists = await checkFileExists(id, url);
            if (!exists) {
                showConfirmModal('File not found. Delete the entry?', () => deleteFile(id, true));
                return;
            }
            window.location = url;
        }

        async function deleteFile(id, skipConfirm) {
            if (!skipConfirm) {
                showConfirmModal('Permanently delete this file?', () => performDelete(id));
                return;
            }
            performDelete(id);
        }

        function deleteSelected() {
            const ids = [...selectedIds];
            if (ids.length === 0) return;
            showConfirmModal(`Permanently delete ${ids.length} selected ${ids.length === 1 ? 'file' : 'files'}?`, () => performBulkDelete(ids));
        }

        async function performBulkDelete(ids) {
            const response = await fetch('/files', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids })
            });
            if (!response.ok) {
                alert('Could not delete selected files.');
                return;
            }
            ids.forEach(id => selectedIds.delete(id));
            load(true);
        }

        async function performDelete(id) {
            await fetch('/files/' + id, { method: 'DELETE' });
            load(true);
        }

        function uploadWithProgress(form) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const progressContainer = document.getElementById('progressContainer');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');

                progressContainer.classList.add('active');
                progressText.classList.add('active');

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total * 100).toFixed(1);
                        const loadedMB = (e.loaded / 1024 / 1024).toFixed(1);
                        const totalMB = (e.total / 1024 / 1024).toFixed(1);
                        progressBar.style.width = percent + '%';
                        progressText.textContent = `${percent}% (${loadedMB} MB / ${totalMB} MB)`;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(xhr.response);
                    } else {
                        reject(new Error('Upload failed: ' + xhr.status));
                    }
                });

                xhr.addEventListener('error', () => reject(new Error('Network error')));

                xhr.open('POST', '/files/upload');
                xhr.send(form);
            });
        }

        async function upload() {
            if (pendingFiles.length === 0) return;
            const form = new FormData();
            for (const file of pendingFiles) {
                form.append('files', file);
            }

            const uploadBtn = document.querySelector('.queue-upload');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            try {
                await uploadWithProgress(form);

                uploadBtn.textContent = 'Uploaded!';
                uploadBtn.style.backgroundColor = '#4caf50';
                uploadBtn.style.color = 'white';

                setTimeout(() => {
                    uploadBtn.textContent = 'Upload selected files';
                    uploadBtn.style.backgroundColor = '';
                    uploadBtn.style.color = '';
                    uploadBtn.disabled = false;
                    progressContainer.classList.remove('active');
                    progressText.classList.remove('active');
                    progressBar.style.width = '0%';
                }, 2000);

                clearQueue();
                load(true);
            } catch (error) {
                uploadBtn.textContent = 'Upload selected files';
                uploadBtn.disabled = false;
                progressContainer.classList.remove('active');
                progressText.classList.remove('active');
                alert('Upload failed: ' + error.message);
            }
        }

        function formatDate(ts) {
            const d = new Date(ts * 1000);
            const yyyy = d.getFullYear().toString();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const min = String(d.getMinutes()).padStart(2, "0");

            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }

        function formatStorageSize(bytes) {
            if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(2)} MB`;
            return `${(bytes / 1024 ** 3).toFixed(2)} GB`;
        }

        async function logout() {
            await fetch('/logout', {
                method: 'POST'
            });
            window.location.href = '/login';
        }

        let confirmCallback = null;

        function showConfirmModal(text, onConfirm) {
            document.getElementById('confirmModalText').textContent = text;
            confirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            confirmCallback = null;
            document.getElementById('confirmModal').classList.remove('active');
        }

        function confirmModalAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        async function checkFileExists(id, url) {
            try {
                const res = await fetch(url, { method: 'HEAD' });
                return res.ok;
            } catch {
                return false;
            }
        }

        load(true);
        fetch('/me')
            .then(response => response.ok ? response.json() : null)
            .then(user => {
                if (user?.username) {
                    document.getElementById('appSubtitle').textContent = `Local Encrypted Storage :: ${user.username}`;
                }
            })
            .catch(() => {});
    </script>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <p id="confirmModalText">DELETE FILE?</p>
            <div class="modal-actions">
                <button class="modal-btn-no" onclick="closeConfirmModal()">NO</button>
                <button class="modal-btn-yes" onclick="confirmModalAction()">YES</button>
            </div>
        </div>
    </div>

</body>
</html>
