<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <title>RSFS</title>
    <style>
        body {font-family: "Roboto", sans-serif;background: #f5f7fa;margin: 0;padding: 2rem;color: #202124;}
        h1 {font-size: 1.8rem;font-weight: 500;margin-bottom: 0.5rem;}
        h2 {font-size: 1.2rem;font-weight: 500;margin-top: 1.5rem;margin-bottom: 0.75rem;}
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }
        .logout-button {
            height: 4rem;
            width: 4rem;
            border: 1px solid #00afa9;
            /* border: 1px solid #1dc204; */
            border-radius: 2rem;
            color:#00afa9;
            /* color:#1dc204; */
            font-size: 1.5rem;
            cursor: pointer;
            margin-bottom: -1rem;
        }
        .logout-button:hover {background:#ff8983;border:1px solid #d93025; color:#d93025;}
        .logout-button:active {background:#d93025;border:1px solid #ff8983;color:#e0e0e0;scale:(0.98);}
        .upload-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .file-input {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 1px solid #dadce0;
            border-radius: 0.45rem;
            font-size: 0.9rem;
            background: #fff;
            transition: border-color 0.2s ease;
        }
        .file-input:hover {border-color: #9aa0a6;}
        .file-input:focus {outline: none;border-color: #1a73e8;box-shadow: 0 0 0 2px rgba(26,115,232,0.2);}
        .upload-button {
            width: 7.5rem;
            height: 2.625rem;
            border: 1px solid #1a73e8;
            border-radius: 0.35rem;
            background: #1a73e8;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }
        .upload-button:hover {background: #1669c1; border: 1px solid #072545;}
        .upload-button:active {background: #0f4fa8;border: 2px solid #5f0571;}
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        th, td {padding: 0.75rem 1rem;text-align: left;border-bottom: 1px solid #e0e0e0;}
        th {background: #f8f9fa;font-weight: 500;color: #5f6368;}
        td button {
            margin: 0.5rem 0.2rem;
            padding: 0.6rem 0.8rem;
            border-radius: 0.45rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            height: 2.5rem;
            min-width: 2.875rem;
        }
        td button:nth-child(1) { background: #e8f0fe; color: #1a73e8; border: 1px solid #e8f0fe}
        td button:nth-child(2) { background: #f1f3f4; color: #202124; border: 1px solid #f1f3f4}
        td button:nth-child(3) { background: #fce8e6; color: #d93025; border: 1px solid #fce8e6}
        /* td button:hover { opacity: 0.9; border: 1px solid blueviolet }
        td button:active { opacity: 0.5; border:1px solid rgb(95, 18, 18) } */
        td button:hover { 
            filter: brightness(0.85);
            border: 1px solid blueviolet
        }
        td button:active { 
            filter: brightness(0.6);
            transform: scale(0.98);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 1.5rem 2rem;
            max-width: 24rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal-box p {
            margin: 0 0 1.5rem 0;
            font-size: 1rem;
            color: #202124;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
        .modal-actions button {
            padding: 0.5rem 1.25rem;
            border-radius: 0.35rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .modal-btn-yes {
            background: #d93025;
            color: white;
            border: 1px solid #d93025;
        }
        .modal-btn-yes:hover { background: #b3261e; }
        .modal-btn-no {
            background: #f1f3f4;
            color: #202124;
            border: 1px solid #f1f3f4;
        }
        .modal-btn-no:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>FILES</h1>
        <button type="submit" onclick="logout()" class="logout-button">⏻</button>
    </div>
    <h2>Upload</h2>
    <div class="upload-card">
        <input type="file" id="file" class="file-input" multiple>
        <button type="submit" onclick="upload()" class="upload-button">Upload</button>
    </div>
    <table id="files"></table>
    <script>
        async function load() {
        const res = await fetch('/files');
        const files = await res.json();
        const table = document.getElementById('files');
        table.innerHTML = '<tr><th>Name</th><th>Size</th><th>Date</th><th>Actions</th></tr>';
        files.forEach(f => {
            table.innerHTML += `
            <tr>
                <td>${f.filename}</td>
                <td style="width: 6rem; font-family: monospace, ui-monospace, system-ui, sans-serif; font-size: 0.75rem;text-align: right;">
                    ${formatSize(f.size)}
                </td>
                <td style="width: 8rem; font-family: monospace, ui-monospace, system-ui, sans-serif; font-size: 0.75rem;">
                    ${formatDate(f.created_at)}
                </td>
                <td style="width: 17rem;">
                    <button onclick="openFile('${f.id}')" style="padding:0.6rem 1rem;margin-right:2rem;">Open</button>
                    <button onclick="downloadFile('${f.id}')" style="padding:0.6rem 1rem;">⭳</button>
                    <button onclick="deleteFile('${f.id}')" style="padding:0.6rem 1rem;">&#128465</button>
                    </td>
            </tr>`;
            });
        }
        // function openFile(id) { window.open('/files/' + id + '/open', '_blank'); }
        // function downloadFile(id) { window.location = '/files/' + id + '/download'; }

        async function openFile(id) {
            const url = '/files/' + id + '/open';
            const exists = await checkFileExists(id, url);
            if (!exists) {
                showConfirmModal('File not found. Delete the entry?', () => deleteFile(id, true));
                return;
            }
            window.open(url, '_blank');
        }

        async function downloadFile(id) {
            const url = '/files/' + id + '/download';
            const exists = await checkFileExists(id, url);
            if (!exists) {
                showConfirmModal('File not found. Delete the entry?', () => deleteFile(id, true));
                return;
            }
            window.location = url;
        }

        async function deleteFile(id, skipConfirm) {
            if (!skipConfirm) {
                showConfirmModal('Permanently delete this file?', () => performDelete(id));
                return;
            }
            performDelete(id);
        }

        async function performDelete(id) {
            await fetch('/files/' + id, { method: 'DELETE' });
            load();
        }

        async function upload() {
            const input = document.getElementById('file');
            const form = new FormData();
            for (const file of input.files) {
                form.append('files', file);
            }
            
            // Upload start
            const uploadBtn = document.querySelector('.upload-button');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            
            try {
                await fetch('/files/upload', {
                    method: 'POST',
                    body: form
                });
                
                // Upload end
                uploadBtn.textContent = 'Uploaded!';
                uploadBtn.style.backgroundColor = '#4caf50';
                uploadBtn.style.color = 'white';
                setTimeout(() => {
                    uploadBtn.textContent = 'Upload';
                    uploadBtn.style.backgroundColor = '';
                    uploadBtn.style.color = '';
                    uploadBtn.disabled = false;
                }, 2000);
                
                input.value = '';
                load();
            } catch (error) {
                uploadBtn.textContent = 'Upload';
                uploadBtn.disabled = false;
                alert('Upload failed: ' + error);
            }
        }   

        function formatDate(ts) {
            const d = new Date(ts * 1000);
            const yyyy = d.getFullYear().toString();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const min = String(d.getMinutes()).padStart(2, "0");

            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }

        async function logout() {
            await fetch('/logout', {
                method: 'POST'
            });
            window.location.href = '/login';
        }

        let confirmCallback = null;

        function showConfirmModal(text, onConfirm) {
            document.getElementById('confirmModalText').textContent = text;
            confirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            confirmCallback = null;
            document.getElementById('confirmModal').classList.remove('active');
        }

        function confirmModalAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        async function checkFileExists(id, url) {
            try {
                const res = await fetch(url, { method: 'HEAD' });
                return res.ok;
            } catch {
                return false;
            }
        }

        load();
    </script>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <p id="confirmModalText">DELETE FILE?</p>
            <div class="modal-actions">
                <button class="modal-btn-no" onclick="closeConfirmModal()">NO</button>
                <button class="modal-btn-yes" onclick="confirmModalAction()">YES</button>
            </div>
        </div>
    </div>

</body>
</html>
