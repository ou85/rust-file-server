<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RSFS · Administration</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color:#161616; background:#f7f7f5; }
    * { box-sizing:border-box; } body { margin:0; padding:2rem 1rem; } main { max-width:56rem; margin:auto; }
    header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem; }
    h1 { margin:0; font-size:2rem; } header p { margin:.25rem 0 0; color:#666; }
    .card { background:#fff; border:1px solid #d8d8d5; border-radius:.9rem; padding:1.5rem; }
    h2 { margin:0 0 1rem; font-size:1.2rem; } form { display:grid; grid-template-columns:1fr 1fr auto; gap:.65rem; margin-bottom:1.2rem; }
    input, button { min-height:2.4rem; border:1px solid #b9b9b5; border-radius:.5rem; padding:.45rem .7rem; font:inherit; }
    button { background:#fff; cursor:pointer; } button:hover { background:#f1f1ef; } .primary { background:#43a563; color:#fff; border-color:#348b50; } .primary:hover { background:#378f54; }
    .logout { color:#b33b3b; } table { width:100%; border-collapse:collapse; } th,td { padding:.75rem .25rem; text-align:left; border-top:1px solid #e5e5e2; } th { color:#666; font-size:.82rem; font-weight:500; } td:last-child { text-align:right; white-space:nowrap; }
    .status { color:#666; font-size:.88rem; } .required { color:#b06a16; } .message { min-height:1.3rem; color:#b33b3b; margin:.6rem 0 0; font-size:.9rem; }
    @media (max-width: 36rem) { form { grid-template-columns:1fr; } th:nth-child(2),td:nth-child(2) { display:none; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>RSFS</h1><p>Administrator Control Panel</p></div><button class="logout" onclick="logout()">Log out</button></header>
  <section class="card"><h2>Users</h2>
    <form id="create-user"><input id="username" required minlength="3" maxlength="64" placeholder="Username" autocomplete="off"><input id="password" required minlength="8" type="password" placeholder="Temporary password" autocomplete="new-password"><button class="primary">Create user</button></form>
    <table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table>
    <div id="message" class="message" role="status"></div>
  </section>
</main>
<script>
const message = document.getElementById('message');
function showMessage(value='') { message.textContent = value; }
async function request(url, options={}) { const response = await fetch(url, options); if (!response.ok) { let text='Request failed'; try { text=(await response.json()).error || text; } catch {} throw new Error(text); } return response.status === 204 ? null : response.json(); }
function button(label, action) { const element=document.createElement('button'); element.type='button'; element.textContent=label; element.onclick=action; return element; }
function row(user) { const tr=document.createElement('tr'); const name=document.createElement('td'); name.textContent=user.username; const role=document.createElement('td'); role.textContent=user.role === 'admin' ? 'Administrator' : 'User'; const status=document.createElement('td'); status.className='status' + (user.password_change_required ? ' required' : ''); status.textContent=user.password_change_required ? 'Password change required' : 'Active'; const actions=document.createElement('td'); if (user.role === 'user') { actions.append(button('Rename', async () => { const username=prompt('New username:', user.username); if (!username || username===user.username) return; try { await request(`/admin/users/${encodeURIComponent(user.id)}/name`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})}); await load(); } catch(error) { showMessage(error.message); }})); actions.append(document.createTextNode(' ')); actions.append(button('Require password change', async () => { try { await request(`/admin/users/${encodeURIComponent(user.id)}/request-password-change`, {method:'POST'}); await load(); } catch(error) { showMessage(error.message); }})); } else { actions.textContent='Protected'; } tr.append(name,role,status,actions); return tr; }
async function load() { try { const users=await request('/admin/users'); const body=document.getElementById('users'); body.replaceChildren(...users.map(row)); showMessage(); } catch(error) { showMessage(error.message); } }
document.getElementById('create-user').onsubmit=async event => { event.preventDefault(); const username=document.getElementById('username'); const password=document.getElementById('password'); try { await request('/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}); event.target.reset(); await load(); } catch(error) { showMessage(error.message); } };
async function logout() { await fetch('/logout',{method:'POST'}); location.href='/login'; }
load();
</script>
</body></html>
