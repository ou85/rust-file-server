<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Admin panel</title>
        <meta charset="UTF-8">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
        <style>
            body {font-family: "Roboto", sans-serif;background: #f5f7fa;margin: 0;padding: 2rem;color: #202124;}
            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 1rem;}
            .logout-button {
                padding: 0.3rem 1.6rem;
                border: 1px solid #ff8983;
                border-radius: 0.25rem;
                font-weight: 500;
                cursor: pointer;}
            .logout-button:hover {background: #ff8983;border: 1px solid #d93025;}
            table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            }
            th, td {padding: 0.75rem 1rem;text-align: left;border-bottom: 1px solid #e0e0e0;}
            th {background: #f8f9fa;font-weight: 500;color: #5f6368;}
            td button {
                margin: 0.5rem 0.2rem;
                padding: 0.6rem 0.8rem;
                border-radius: 0.25rem;
                cursor: pointer;
                font-size: 0.85rem;
                font-weight: 500;
            }
            td button:nth-child(1) { background: #e8f0fe; color: #1a73e8; border: 1px solid #e8f0fe}
            td button:nth-child(2) { background: #f1f3f4; color: #202124; border: 1px solid #f1f3f4}
            td button:hover { opacity: 0.9; border: 1px solid blueviolet }
            .add-button {
                width: 5rem;
                height: 2rem;
                border: 1px solid #1a73e8;
                border-radius: 0.25rem;
                background: #1a73e8;
                color: white;
                font-weight: 500;
                cursor: pointer;
                font-size: 0.9rem;
                transition: background 0.2s ease;
                margin-bottom: 0.7rem;
            }
            .add-button:hover {background: #1669c1; border: 1px solid #072545;}
            .actions{text-align: right;}
        </style>
    </head>
    <body>
        <div class="top-bar">
            <h1>Admin Panel</h1>
            <button type="submit" onclick="logout()" class="logout-button">⏻</button>
        </div>
        <h4>One day it should be done... but not today.</h4>
        <div class="add-card">
        <button type="submit" onclick="add_user()" class="add-button">Add user</button>
        </div>
        <table id="files">
            <thead>
                <tr><th>Name</th><th>Role</th><th>Status</th><th class="actions">Actions</th></tr>
            </thead>
            <tbody>
                <tr><td>admin</td><td>Administrator</td><td>active</td>
                    <td class="actions">
                        <button type="submit" onclick="openFile('${f.id}')">Edit</button>
                        <button type="submit" onclick="deleteFile('${f.id}')">Delete</button>
                    </td>
                </tr>
                <tr><td>user</td><td>User</td><td>active</td>
                    <td class="actions">
                        <button type="submit" onclick="openFile('${f.id}')">Edit</button>
                        <button type="submit" onclick="deleteFile('${f.id}')">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <script>
        async function logout() {
            await fetch('/logout', {
                method: 'POST'
            });
            window.location.href = '/login';
        }
        </script>
    </body>
</html>
