<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RSFS · Change password</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color:#161616; background:#f7f7f5; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1rem; }
    main { width:min(100%, 25rem); padding:2rem; background:#fff; border:1px solid #d8d8d5; border-radius:.9rem; }
    h1 { margin:0 0:.4rem; font-size:1.55rem; } p { margin:0 0:1.5rem; color:#666; line-height:1.45; }
    form { display:grid; gap:.8rem; } input,button { min-height:2.6rem; border:1px solid #b9b9b5; border-radius:.5rem; padding:.55rem .7rem; font:inherit; }
    button { cursor:pointer; background:#43a563; color:#fff; border-color:#348b50; font-weight:600; } button:hover { background:#378f54; }
    #error { min-height:1.2rem; margin:0; color:#c73d3d; font-size:.9rem; }
  </style>
</head>
<body><main>
  <h1>Set a new password</h1><p>Your administrator requested a password change. Choose a new password with at least 8 characters.</p>
  <form id="form"><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="New password"><input id="confirmation" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat new password"><p id="error" role="alert"></p><button>Save password</button></form>
</main>
<script>
document.getElementById('form').onsubmit=async event => { event.preventDefault(); const password=document.getElementById('password').value; const confirmation=document.getElementById('confirmation').value; const error=document.getElementById('error'); const response=await fetch('/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,confirmation})}); if (response.ok) { location.href='/'; return; } try { error.textContent=(await response.json()).error || 'Unable to change password'; } catch { error.textContent='Unable to change password'; } };
</script>
</body></html>
