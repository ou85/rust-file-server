<!doctype html>
<html lang="eng">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{STATUS}} · RSFS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: #f7f7f5; color: #161616; font: 1rem system-ui, sans-serif; }
        main { width: min(100%, 28rem); padding: 2.5rem 1.5rem; border: .0625rem solid #d8d8d5; border-radius: .9375rem; background: #fff; text-align: center; }
        .brand { margin: 0 0 1.5rem; color: #858585; font-size: .875rem; }
        .status { margin: 0; color: #666; font-size: 2rem; font-weight: 700; }
        h1 { margin: 1rem 0 1.75rem; font-size: 1.25rem; font-weight: 600; overflow-wrap: anywhere; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
        button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.5rem; padding: .5rem 1rem; border: .0625rem solid #d0d0d0; border-radius: .5rem; background: #fff; color: #222; font: inherit; text-decoration: none; cursor: pointer; }
        button:hover, a:hover { background: #f0f0f0; }
        button:focus-visible, a:focus-visible { outline: .125rem solid #75c995; outline-offset: .125rem; }
    </style>
</head>
<body>
    <main>
        <p class="brand">RSFS</p>
        <p class="status">{{STATUS}}</p>
        <h1>{{MESSAGE}}</h1>
        <div class="actions">
            <!-- <button type="button" onclick="if (history.length > 1) history.back(); else location.href = '/'">Back</button> -->
            <a href="/">OK</a>
        </div>
    </main>
</body>
</html>
