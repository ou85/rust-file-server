[package]
name = "rust-file-server"
version = "0.1.0"
license = "GPL-3.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.21"
bcrypt = "0.17"
bytes = "1"
chrono = "0.4"
dotenvy = "0.15.7"
futures = "0.3"
hex = "0.4"
mime_guess = "2"
rand = "0.9"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io", "codec"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
members = ["tools/keygen", "tools/hashgen"]

