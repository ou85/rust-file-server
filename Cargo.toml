[package]
name = "rust-file-server"
version = "0.1.0"
license = "GPL-3.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
bcrypt = "0.19.2"
bytes = "1.12.0"
chrono = "0.4"
dotenvy = "0.15.7"
futures = "0.3"
hex = "0.4"
mime_guess = "2"
rand = "0.10.2"
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io", "codec"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.4", features = ["v4"] }



