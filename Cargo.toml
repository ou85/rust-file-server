[package]
name = "rust-file-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
bcrypt = "0.17"
chrono = "0.4"
dotenvy = "0.15.7"
mime_guess = "2"
rand = "0.9"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

